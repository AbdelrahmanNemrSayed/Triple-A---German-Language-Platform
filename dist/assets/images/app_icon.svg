<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="flagGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffce00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dd0000" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- German Flag Accent Bar at top -->
  <g transform="translate(136, 70)">
    <rect x="0" y="0" width="240" height="8" rx="4" fill="#111111" />
    <rect x="0" y="8" width="240" height="8" rx="0" fill="url(#flagRed)" />
    <rect x="0" y="16" width="240" height="8" rx="4" fill="url(#flagGold)" />
  </g>

  <!-- Central Triple A Monogram + Eagle Crown Symbol -->
  <g filter="url(#glow)">
    <!-- Triple 'A' Styling -->
    <path d="M 256 120 L 370 360 L 320 360 L 295 300 L 217 300 L 192 360 L 142 360 Z M 256 195 L 232 255 L 280 255 Z" fill="#ffffff" />
    
    <!-- Secondary Left A Outline (Layered Effect) -->
    <path d="M 180 230 L 130 350 L 165 350 L 175 320 L 210 320" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Secondary Right A Outline (Layered Effect) -->
    <path d="M 332 230 L 382 350 L 347 350 L 337 320 L 302 320" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- DEUTSCHMEISTER PRO Text -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4" text-anchor="middle">TRIPLE A</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#38bdf8" letter-spacing="3" text-anchor="middle">DEUTSCHMEISTER</text>
</svg>
